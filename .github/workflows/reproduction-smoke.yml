name: Reproduction smoke test
on:
  workflow_dispatch:
  pull_request:
    paths: ['reproduction/**','src/**','examples/article_systems/**']
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: hopping3d-eht doctor
      - run: python reproduction/article_cases/run_interface.py
      - run: python -m pytest -q tests/test_eht_public.py
