name: Reproduction smoke test
on:
  workflow_dispatch:
  pull_request:
    paths: ['reproduction/**','src/**']
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - run: python reproduction/scripts/plot_publication_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-figures
          path: reproduction/generated/*.png
