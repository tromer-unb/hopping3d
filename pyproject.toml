[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopping3d"
version = "1.0.0"
description = "Trajectory-resolved kinetic Monte Carlo for hopping transport in 2D and 3D atomic networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "J. P. Dadario Pereira"},
  {name = "Raphael Tromer"},
  {name = "Luiz A. Ribeiro Junior"},
  {name = "Douglas S. Galvao"}
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "ase>=3.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hopping3d = "hopping3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
